services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sit-ciit-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT TCP (nodos, backend)
      - "9001:9001" # MQTT sobre WebSocket (dashboard, si se necesita en el futuro)
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: sit-ciit-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sitciit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitciit_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sitciit}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sitciit}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mosquitto-data:
  mosquitto-log:
  timescaledb-data:
